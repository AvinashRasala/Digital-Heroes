<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadDesk Mini — Pipeline Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <header class="topbar">
    <div class="topbar__mark">LEADDESK <span>MINI</span> — PIPELINE BOARD</div>
    <div class="topbar__meta">
      <span id="whoami"></span>
      <button id="exportBtn" class="link-btn">Export CSV</button>
      <button id="logoutBtn" class="link-btn">Log out</button>
    </div>
  </header>

  <main class="board">
    <div class="board__controls">
      <input type="search" id="searchInput" placeholder="Search name, email, or message..." class="board__search">
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="board__columns">
      <section class="column" data-status="New">
        <h2 class="column__title"><span class="column__dot dot-new"></span>New <span class="column__count" id="count-New">0</span></h2>
        <div class="column__cards" id="cards-New"></div>
      </section>
      <section class="column" data-status="Contacted">
        <h2 class="column__title"><span class="column__dot dot-contacted"></span>Contacted <span class="column__count" id="count-Contacted">0</span></h2>
        <div class="column__cards" id="cards-Contacted"></div>
      </section>
      <section class="column" data-status="Closed">
        <h2 class="column__title"><span class="column__dot dot-closed"></span>Closed <span class="column__count" id="count-Closed">0</span></h2>
        <div class="column__cards" id="cards-Closed"></div>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
